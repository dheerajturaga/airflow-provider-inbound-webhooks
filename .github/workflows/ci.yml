---
name: CI

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so the "latest" matrix entry picks up a new Airflow release without waiting for a commit.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Run prek
        run: uvx prek==0.3.4 run --all-files --show-diff-on-failure

  tests:
    name: Tests (Airflow ${{ matrix.airflow }}, Python ${{ matrix.python }}, ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum supported version, the newest patch of each supported minor and whatever is
          # newest, each on the oldest and the newest Python it supports.
          - {airflow: "3.1.1", python: "3.10", database: sqlite}
          - {airflow: "3.1.1", python: "3.13", database: sqlite}
          - {airflow: "3.1.8", python: "3.10", database: sqlite}
          - {airflow: "3.1.8", python: "3.13", database: sqlite}
          - {airflow: "3.2.2", python: "3.10", database: sqlite}
          - {airflow: "3.2.2", python: "3.14", database: sqlite}
          - {airflow: "3.3.2", python: "3.10", database: sqlite}
          - {airflow: "3.3.2", python: "3.14", database: sqlite}
          - {airflow: latest, python: "3.10", database: sqlite}
          - {airflow: latest, python: "3.14", database: sqlite}
          # Production databases on the oldest and newest Airflow, whose asset tables differ most.
          - {airflow: "3.1.1", python: "3.12", database: postgres}
          - {airflow: "3.1.1", python: "3.12", database: mysql}
          - {airflow: latest, python: "3.12", database: postgres}
          - {airflow: latest, python: "3.12", database: mysql}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Resolve the Airflow version
        id: airflow
        env:
          REQUESTED: ${{ matrix.airflow }}
        run: |
          if [[ "$REQUESTED" == "latest" ]]; then
            version=$(curl -sSf https://pypi.org/pypi/apache-airflow/json | jq -r .info.version)
          else
            version="$REQUESTED"
          fi
          echo "Testing against Airflow $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Start the database
        if: matrix.database != 'sqlite'
        timeout-minutes: 3
        env:
          DATABASE: ${{ matrix.database }}
        run: |
          # Readiness is checked over TCP: both images first run a setup server that only listens on a
          # socket, then restart.
          if [[ "$DATABASE" == "postgres" ]]; then
            docker run --detach --name database --publish 127.0.0.1:5432:5432 \
              --env POSTGRES_USER=airflow --env POSTGRES_PASSWORD=airflow --env POSTGRES_DB=airflow \
              postgres:17
            until docker exec database pg_isready --host 127.0.0.1 --username airflow; do sleep 2; done
            url="postgresql+psycopg2://airflow:airflow@127.0.0.1:5432/airflow"
          else
            docker run --detach --name database --publish 127.0.0.1:3306:3306 \
              --env MYSQL_ROOT_PASSWORD=airflow --env MYSQL_DATABASE=airflow \
              mysql:8.4
            until docker exec database mysqladmin ping --host 127.0.0.1 --user root --password=airflow \
              --silent; do sleep 2; done
            url="mysql+mysqldb://root:airflow@127.0.0.1:3306/airflow"
          fi
          echo "INBOUND_WEBHOOKS_TEST_DATABASE=$url" >> "$GITHUB_ENV"
      - name: Install Airflow and the package's wheel with Airflow's constraints
        env:
          AIRFLOW_VERSION: ${{ steps.airflow.outputs.version }}
          PYTHON_VERSION: ${{ matrix.python }}
          DATABASE: ${{ matrix.database }}
        run: |
          constraints="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          # A uv-managed Python ships the headers that building mysqlclient needs.
          uv venv -p "$PYTHON_VERSION" --managed-python
          airflow="apache-airflow==${AIRFLOW_VERSION}"
          if [[ "$DATABASE" != "sqlite" ]]; then
            # Airflow's extra brings the sync and async drivers its version uses for this database.
            airflow="apache-airflow[${DATABASE}]==${AIRFLOW_VERSION}"
          fi
          if [[ "$DATABASE" == "mysql" ]]; then
            sudo apt-get update --quiet
            sudo apt-get install --yes --no-install-recommends libmysqlclient-dev pkg-config
          fi
          uv pip install "$airflow" --constraint "$constraints"
          # The wheel rather than the source tree, so the tests cover what a release publishes.
          uv build --wheel --out-dir dist
          uv pip install dist/*.whl pytest mypy --constraint "$constraints"
          .venv/bin/python -c "import airflow_inbound_webhooks; print(airflow_inbound_webhooks.__file__)"
      # Only against the newest release: older ones annotate their models less precisely (3.1's are
      # Column[...] declarations, and 3.1.1 pins an untyped SQLAlchemy), so mypy reports their typing,
      # not this package's. Changed signatures in Airflow internals show up in the newest release first.
      - name: Type-check
        if: matrix.airflow == 'latest' && matrix.python == '3.14' && matrix.database == 'sqlite'
        run: .venv/bin/mypy src
      - name: Run tests
        run: .venv/bin/pytest

  minimum-airflow-version:
    name: Refuses Airflow 3.1.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Installing next to Airflow 3.1.0 must fail on the package's Airflow requirement
        run: |
          constraints="https://raw.githubusercontent.com/apache/airflow/constraints-3.1.0/constraints-3.11.txt"
          uv venv -p 3.11
          if uv pip install . "apache-airflow==3.1.0" --constraint "$constraints" > install.log 2>&1; then
            echo "::error::The package installed next to Airflow 3.1.0"
            exit 1
          fi
          # uv wraps its explanation across lines, so collapse whitespace before matching.
          tr -s '[:space:]' ' ' < install.log | grep -q "depends on apache-airflow>=3.1.1" \
            || { cat install.log; exit 1; }
          echo "Refused as expected: the package depends on apache-airflow>=3.1.1"

  # The one check the main ruleset requires, so the matrix can change without updating the ruleset.
  ci-passed:
    name: CI passed
    if: always()
    needs: [static-checks, tests, minimum-airflow-version]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          # A matrix job's result is success only if every one of its entries succeeded.
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A job ended with $result; every job must pass"
              exit 1
            fi
          done
