---
name: Release

on:  # yamllint disable-line rule:truthy
  push:
    tags: ["v*"]
  # A dry run, started by hand: publishes main to TestPyPI as <version>.dev<run number>.
  workflow_dispatch:

permissions: {}

# One run per tag, and never cancelled: a release must not stop between uploading its files.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read  # To check out the tagged commit; building needs nothing else.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # The whole history, to check that the commit is on main.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          # What is published must not depend on a cache that another workflow run wrote.
          enable-cache: false
      - name: Check that the commit is on main
        run: |
          # Commits reach main only through pull requests that passed CI, so this publishes nothing
          # that skipped it, such as a tag pushed on a commit that was never merged.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse --short HEAD) is not on main; merge it before releasing it"
            exit 1
          fi
      - name: Check that the tag names the package version, and the changelog has its section
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c '
          import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match the version in pyproject.toml, $version"
            exit 1
          fi
          if ! grep -qE "^## ${version//./\\.} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section \"## $version - <date>\""
            exit 1
          fi
      - name: Give the dry run a version of its own
        if: github.event_name == 'workflow_dispatch'
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # TestPyPI, like PyPI, never accepts a version twice, so each dry run uploads its own.
          sed -i -E "s/^version = \"([^\"]+)\"$/version = \"\1.dev${RUN_NUMBER}\"/" pyproject.toml
          grep -E "^version = \".+\.dev${RUN_NUMBER}\"$" pyproject.toml
      - name: Build the sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    # Allows only main; see "Releasing" in CONTRIBUTING.md.
    environment:
      name: testpypi
      url: https://test.pypi.org/project/airflow-provider-inbound-webhooks/
    permissions:
      id-token: write  # Trusted publishing, as for PyPI.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # Each dry run has its own version, so only a re-run of a partly finished upload meets one.
          skip-existing: true

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    # Its protection rules decide who approves a release; see "Releasing" in CONTRIBUTING.md.
    environment:
      name: pypi
      url: https://pypi.org/project/airflow-provider-inbound-webhooks/
    permissions:
      id-token: write  # Trusted publishing: PyPI takes this job's OIDC token, so none is stored.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      # Checks the metadata, uploads, and attests that this workflow built the files.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
